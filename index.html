<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Under construction landing page for a site currently being prepared for launch."
    />
    <title>Under Construction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="bg-orb orb-one"></div>
      <div class="bg-orb orb-two"></div>

      <main class="card" aria-labelledby="title">
        <p class="eyebrow">Website update</p>
        <h1 id="title">Under Construction</h1>
        <p class="subtitle">
          We’re putting the finishing touches on something great.
        </p>

        <div class="status-row" aria-label="Current status">
          <span class="status-dot"></span>
          <span>Launching soon</span>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <p class="message">
          This page is being prepared for launch. Please check back soon for updates,
          announcements, and the full experience.
        </p>
      </main>
    </div>
  </body>
</html>
